# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Appium 2.0 and dependencies
        run: |
          node -v
          npm install
          npm list
      # io.eot:figmacompare is resolved from figmacompare's GitHub Packages registry
      # (see build.gradle's repositories block) instead of being built from source here.
      # anandbagmar/figmacompare is private, so reading its packages needs an
      # authenticated token even though this is the same account - a classic PAT with
      # repo + read:packages, stored as the FIGMACOMPARE_PAT secret in this repo's
      # Settings -> Secrets and variables -> Actions.
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: build --refresh-dependencies -x test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FIGMACOMPARE_PAT: ${{ secrets.FIGMACOMPARE_PAT }}
