# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      # This repo depends on io.eot:figmacompare via mavenLocal (see settings.gradle/
      # samples/build.gradle) instead of an in-repo module, so it has to be built and
      # published here first. anandbagmar/figmacompare is private, so the default
      # GITHUB_TOKEN (scoped to this repo only) can't check it out - add a Personal
      # Access Token with read access to that repo as a secret named FIGMACOMPARE_PAT
      # in this repo's Settings -> Secrets and variables -> Actions before this will work.
      - name: Checkout figmacompare
        uses: actions/checkout@v4
        with:
          repository: anandbagmar/figmacompare
          path: figmacompare
          token: ${{ secrets.FIGMACOMPARE_PAT }}
      - name: Build and publish figmacompare to mavenLocal
        run: cd figmacompare && ./gradlew publishToMavenLocal
      - name: Install Appium 2.0 and dependencies
        run: |
          node -v
          npm install
          npm list
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: build --refresh-dependencies -x test
