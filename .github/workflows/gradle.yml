# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual-only trigger (Actions tab -> this workflow -> "Run workflow") for
  # uploadFromFigma - see the "Upload Figma designs as Applitools baselines" step
  # below, gated to only run for this trigger. Never runs on a push/PR, since it
  # creates new Applitools baselines and shouldn't happen silently on every commit.
  workflow_dispatch:
    inputs:
      runUpload:
        description: "Run uploadFromFigma first (check to also create new baselines before comparing - default just re-runs compareWebWithFigma against whatever baselines already exist)"
        type: boolean
        default: false
      forceRefresh:
        description: "uploadFromFigma only: re-download every Figma image even if a cached copy exists"
        type: boolean
        default: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only for the "Trim old workflow runs" step below.
      actions: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Appium 2.0 and dependencies
        run: |
          node -v
          npm install
          npm list
      # Resolves the latest figmacompare release tag so CI always builds against the
      # newest published version rather than a hardcoded default - see
      # scripts/latest-figmacompare-version.sh. anandbagmar/figmacompare is public, so
      # this is a plain unauthenticated request - no token needed.
      - name: Resolve latest figmacompare version
        id: figmacompare_version
        run: echo "version=$(./scripts/latest-figmacompare-version.sh)" >> "$GITHUB_OUTPUT"
      # io.eot:figmacompare is resolved via JitPack (see build.gradle's repositories
      # block), which builds directly from anandbagmar/figmacompare's public tags on
      # demand - no token needed to consume.
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: build --refresh-dependencies -x test -PfigmacompareVersion=${{ steps.figmacompare_version.outputs.version }}
      # figma-visual-testing/*.xlsx is gitignored (contains real Figma/Applitools data),
      # so CI reconstructs a CI-scoped copy from a secret instead - see README.md's
      # "Continuous Integration" section for how FIGMA_CI_EXCEL_B64 was generated.
      - name: Restore CI Figma Excel file from secret
        run: echo "$FIGMA_CI_EXCEL_B64" | base64 --decode > figma-visual-testing/figma_mockede2e_web_ci.xlsx
        env:
          FIGMA_CI_EXCEL_B64: ${{ secrets.FIGMA_CI_EXCEL_B64 }}
      # Without this, every uploadFromFigma run - including every manual test run while
      # iterating - re-downloads every Figma image from scratch, which is what drove us
      # into Figma's API rate limit (HTTP 429) earlier. Cache key is the Excel file's
      # content hash, so unrelated edits (e.g. tweaking a non-image field) still hit the
      # cache; restore-keys falls back to the most recent cache otherwise, so most
      # already-downloaded images are still reused even after a real content change -
      # FigmaClient looks up cached images by Figma URL/scale/format regardless of the
      # exact key that restored them.
      - name: Cache Figma downloaded images
        if: github.event_name == 'workflow_dispatch' && inputs.runUpload
        uses: actions/cache@v4
        with:
          path: downloaded_images/figma-cache
          key: figma-cache-${{ hashFiles('figma-visual-testing/figma_mockede2e_web_ci.xlsx') }}
          restore-keys: |
            figma-cache-
      # Only runs on a manual "Run workflow" dispatch (see the workflow_dispatch trigger
      # above) - uploads the Web rows in the CI Excel file to Applitools as new
      # baselines, updating figma_mockede2e_web_ci.xlsx IN PLACE (new Baseline Env
      # Name/Batch URL/Status per row). Runs before "Run web Figma visual tests" below
      # so that step compares against these fresh baselines instead of stale ones. Pure
      # Java, no browser needed, so no HEADLESS here.
      - name: Upload Figma designs as Applitools baselines
        if: github.event_name == 'workflow_dispatch' && inputs.runUpload
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: >-
            uploadFromFigma
            -PfigmaExcel=figma-visual-testing/figma_mockede2e_web_ci.xlsx
            -Pplatform=Web
            -PforceRefresh=${{ inputs.forceRefresh }}
            -PfigmacompareVersion=${{ steps.figmacompare_version.outputs.version }}
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          # UploadFromFigma.main() (unlike compareWebWithFigma) has no built-in default
          # for this and hard-fails without it - not a secret, so it's fine hardcoded here.
          APPLITOOLS_SERVER_URL: https://eyes.applitools.com
          # figmacompare is CI-provider agnostic, so it never reads GITHUB_RUN_NUMBER
          # itself - we map it into the generic CI_RUN_NUMBER key it does read, so
          # Applitools batch names get suffixed with this run's number (see BatchSupport
          # in figmacompare).
          CI_RUN_NUMBER: ${{ github.run_number }}
      # Runs on every trigger, including right after the upload step above on a manual
      # dispatch - always reads whatever is currently on disk in
      # figma_mockede2e_web_ci.xlsx, so on a manual dispatch that's the freshly-uploaded
      # baselines from the step above, and on push/PR it's the untouched CI file
      # restored from the secret. Also writes its own results (Comparison Batch
      # URL/Validation Status) back into the same file.
      - name: Run web Figma visual tests
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: compareWebWithFigma -PfigmaExcel=figma-visual-testing/figma_mockede2e_web_ci.xlsx -PfigmacompareVersion=${{ steps.figmacompare_version.outputs.version }}
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          HEADLESS: "true"
          # See the CI_RUN_NUMBER comment on the upload step above.
          CI_RUN_NUMBER: ${{ github.run_number }}
      # Only on a manual dispatch - by this point the Excel file carries both the
      # upload step's baseline results AND the compare step's comparison results, so
      # this one artifact shows the full picture. Surfaced as a workflow artifact since
      # the file itself is never committed. Short retention since this is a one-off
      # inspection copy, not something to keep long-term.
      - name: Upload updated Excel file with results
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: figma_mockede2e_web_ci-with-results
          path: figma-visual-testing/figma_mockede2e_web_ci.xlsx
          retention-days: 7
      # Keeps GitHub Actions run history (and its storage/minutes usage) small on a free
      # account - deletes everything but the 5 most recent runs of this workflow. Safe:
      # only removes CI run history/logs, never touches code or dependencies.
      - name: Trim old workflow runs (keep last 5)
        if: always()
        run: |
          gh run list --workflow "${{ github.workflow }}" --repo "${{ github.repository }}" \
              --limit 100 --json databaseId --jq '.[5:][].databaseId' \
            | xargs -r -n1 gh run delete --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
