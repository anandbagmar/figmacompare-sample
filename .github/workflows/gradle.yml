# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only for the "Trim old workflow runs" step below.
      actions: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Appium 2.0 and dependencies
        run: |
          node -v
          npm install
          npm list
      # Resolves the latest figmacompare release tag so CI always builds against the
      # newest published version rather than a hardcoded default - see
      # scripts/latest-figmacompare-version.sh. GH_TOKEN authenticates gh CLI against
      # the private figmacompare repo (same FIGMACOMPARE_PAT used to consume its
      # packages below).
      - name: Resolve latest figmacompare version
        id: figmacompare_version
        run: echo "version=$(./scripts/latest-figmacompare-version.sh)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.FIGMACOMPARE_PAT }}
      # io.eot:figmacompare is resolved from figmacompare's GitHub Packages registry
      # (see build.gradle's repositories block) instead of being built from source here.
      # anandbagmar/figmacompare is private, so reading its packages needs an
      # authenticated token even though this is the same account - a classic PAT with
      # repo + read:packages, stored as the FIGMACOMPARE_PAT secret in this repo's
      # Settings -> Secrets and variables -> Actions.
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: build --refresh-dependencies -x test -PfigmacompareVersion=${{ steps.figmacompare_version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FIGMACOMPARE_PAT: ${{ secrets.FIGMACOMPARE_PAT }}
      # figma-visual-testing/*.xlsx is gitignored (contains real Figma/Applitools data),
      # so CI reconstructs a CI-scoped copy from a secret instead - see README.md's
      # "Continuous Integration" section for how FIGMA_CI_EXCEL_B64 was generated.
      - name: Restore CI Figma Excel file from secret
        run: echo "$FIGMA_CI_EXCEL_B64" | base64 --decode > figma-visual-testing/figma_mockede2e_web_ci.xlsx
        env:
          FIGMA_CI_EXCEL_B64: ${{ secrets.FIGMA_CI_EXCEL_B64 }}
      # uploadFromFigma is intentionally NOT run in CI - this only compares the app
      # against baselines that already exist in Applitools, so FIGMA_TOKEN isn't needed.
      - name: Run web Figma visual tests
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1
        with:
          arguments: compareWebWithFigma -PfigmaExcel=figma-visual-testing/figma_mockede2e_web_ci.xlsx -PfigmacompareVersion=${{ steps.figmacompare_version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          FIGMACOMPARE_PAT: ${{ secrets.FIGMACOMPARE_PAT }}
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          HEADLESS: "true"
      # Keeps GitHub Actions run history (and its storage/minutes usage) small on a free
      # account - deletes everything but the 5 most recent runs of this workflow. Safe:
      # only removes CI run history/logs, never touches code or dependencies.
      - name: Trim old workflow runs (keep last 5)
        if: always()
        run: |
          gh run list --workflow "${{ github.workflow }}" --repo "${{ github.repository }}" \
              --limit 100 --json databaseId --jq '.[5:][].databaseId' \
            | xargs -r -n1 gh run delete --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
