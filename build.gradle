buildscript {
    ext {
        gradleVersion = '9.3.1'
    }
    repositories {
        mavenLocal()
    }
}

plugins {
    id "idea"
    id "base"
}
version '0.0.1'

// This is now a multi-module build: 'core' (the reusable framework, no TestNG, no
// this-project-specific classes - see core/build.gradle) and 'samples' (this
// project's actual usage of it - see samples/build.gradle for the real task
// definitions). These root-level tasks are just aliases so existing commands like
// `./gradlew uploadFromFigma` keep working without a ":samples:" prefix.
task test {
    group = "verification"
    description = "Alias for :samples:test"
    dependsOn ":samples:test"
}

task uploadFromFigma {
    group = "applitools"
    description = "Alias for :samples:uploadFromFigma"
    dependsOn ":samples:uploadFromFigma"
}

task compareWebWithFigma {
    group = "applitools"
    description = "Alias for :samples:compareWebWithFigma"
    dependsOn ":samples:compareWebWithFigma"
}

task compareAndroidWithFigma {
    group = "applitools"
    description = "Alias for :samples:compareAndroidWithFigma"
    dependsOn ":samples:compareAndroidWithFigma"
}

task compareIosWithFigma {
    group = "applitools"
    description = "Alias for :samples:compareIosWithFigma"
    dependsOn ":samples:compareIosWithFigma"
}

clean.doFirst {
    delete "${rootDir}/target"
    delete "${rootDir}/bin"
    delete "${rootDir}/build"
    delete "${rootDir}/out"
    println "Clean: Deleted bin, build, out, target and reports directories"
}

clean.doLast {
    mkdir "${rootDir}/reports"
    println "Created reports directory"
}

wrapper {
    gradleVersion = project.gradleVersion // version from gradle.properties
}
