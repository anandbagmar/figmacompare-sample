import org.codehaus.groovy.runtime.GStringImpl

import java.text.SimpleDateFormat

buildscript {
    ext {
        gradleVersion = '9.3.1'
    }
    repositories {
        mavenLocal()
    }
}

plugins {
    id "idea"
    id "java"
}

version '0.0.1'

repositories {
    // Tried first, so a local `./gradlew publishToMavenLocal` in figmacompare (its
    // everyday dev loop) is always picked up automatically.
    mavenLocal()
    // Real releases of figmacompare (github.com/anandbagmar/figmacompare, public) are
    // resolved via JitPack, which builds directly from that repo's tags on demand - no
    // token needed, unlike GitHub Packages' Maven registry (which this project used
    // before, and which requires auth even for a public repo - a genuine platform
    // limitation, not something we could avoid while staying on it).
    maven { url = uri("https://jitpack.io") }
    mavenCentral()
}

compileJava { options.encoding = "UTF-8" }

// Real release, published from figmacompare's own release workflow - see its README's
// "Publishing a release" section for how to cut a new one. Defaults to resolving the
// latest release automatically (via scripts/latest-figmacompare-version.sh, which now
// returns the tag as-is, e.g. "v1.2.0" - JitPack needs the exact tag) - pass
// -PfigmacompareVersion=<version> to pin an explicit one instead (e.g. to reproduce an
// old build, or while iterating locally against a mavenLocal() publish, e.g.
// "0.0.1-local"). Hard-fails (does not fall back to some other version) if resolution
// fails, e.g. no network - silently using a different version than what was actually
// requested would be worse than a clear error.
def figmacompareVersion
if (project.hasProperty('figmacompareVersion')) {
    figmacompareVersion = project.property('figmacompareVersion')
} else {
    // project.exec {} was removed in Gradle 9 - providers.exec {} is the current API.
    figmacompareVersion = providers.exec {
        commandLine 'sh', '-c', './scripts/latest-figmacompare-version.sh'
    }.standardOutput.asText.get().trim()
    println "No -PfigmacompareVersion given - resolved latest figmacompare release: ${figmacompareVersion}"
}
// mavenLocal() publishes as io.eot:figmacompare:<version> (see figmacompare's own
// build.gradle) - "-local" is the convention for a locally-published dev build (its
// default, and what scripts/latest-figmacompare-version.sh never returns). A real
// release resolves via JitPack instead, which always uses com.github.<owner> as the
// groupId for a single-module project - a JitPack constraint, not configurable - so it
// intentionally differs from the io.eot.figmacompare Java package namespace used
// throughout the actual code (see figmacompare's README's "Publishing a release").
def figmacompareCoordinate = figmacompareVersion.endsWith('-local')
        ? "io.eot:figmacompare:${figmacompareVersion}"
        : "com.github.anandbagmar:figmacompare:${figmacompareVersion}"

dependencies {
    implementation figmacompareCoordinate
    implementation enforcedPlatform("org.seleniumhq.selenium:selenium-bom:4.48.0")
    implementation "com.applitools:eyes-images-java5:5.83.3"
    implementation ("com.applitools:eyes-appium-java5:5.79.44") {
        exclude group: 'io.appium', module: 'java-client'
    }
    implementation "io.appium:java-client:10.1.1"
    implementation "org.testng:testng:7.12.0"
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.38'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'jaxen:jaxen:2.0.6'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.dom4j:dom4j:2.2.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    testImplementation 'org.testng:testng:7.12.0'
}

static def getCurrentDatestamp() {
    Date today = new Date()
    SimpleDateFormat df = new SimpleDateFormat("MM-dd-yyyy")
    return df.format(today)
}

static def getCurrentTimestamp() {
    Date today = new Date()
    SimpleDateFormat df = new SimpleDateFormat("HH-mm-ss")
    return df.format(today)
}

project.ext.logDir = "${rootDir}/reports/" + getCurrentDatestamp() + "/" + getCurrentTimestamp() as GStringImpl

// Shared TestNG/logging/env setup applied to `test` and to each per-platform
// compare*WithFigma task below, so they all behave consistently.
ext.configureTestNGTask = { Test t ->
    if (project.hasProperty("figmaExcel")) {
        t.systemProperty "figmaExcel", project.property("figmaExcel")
    }
    t.workingDir = rootDir
    t.doFirst {
        environment "APPLITOOLS_DONT_CLOSE_BATCHES", "true"
        environment "APPLITOOLS_LOG_DIR", "${project.logDir}/applitools_logs"
        environment "LOG_DIR", "${project.logDir}"
    }
    t.useTestNG()
    t.reports {
        html.required.set(true)
        junitXml.required.set(true)
        html.outputLocation.set(file("$project.logDir/html"))
        junitXml.outputLocation.set(file("$project.logDir/junit"))
    }
    t.reports.junitXml.outputPerTestCase(true)
    t.testLogging {
        events "started", "passed", "skipped", "failed"
        // show standard out and standard error of the test JVM(s) on the console
        showStandardStreams = true
        // show full exception trace
        exceptionFormat = 'full'
        showStackTraces = true
        showCauses = true
        showExceptions = true
    }
    println("Log directory: ${project.logDir}")
    println("Debug mode: " + System.getProperty('debug', 'false'))
    // attach debugger
    if (System.getProperty('debug', 'false') == 'true') {
        println("In debug mode")
        t.jvmArgs '-Xdebug', '-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,' + 'address=*:5005'
    }
}

test {
    if (project.hasProperty("testClass")) {
        def classFilePattern = project.property("testClass").toString().replace('.', '/') + ".class"
        include classFilePattern
        println("Running only test class include pattern: ${classFilePattern}")
    }
    configureTestNGTask(it)
}

task compareWebWithFigma(type: Test) {
    group = "applitools"
    description = "Run compareWithFigma for Web rows in the shared Figma Excel file"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "io/eot/pipeline/web/selenium/CompareWebWithFigmaTest.class"
    configureTestNGTask(it)
}

task compareAndroidWithFigma(type: Test) {
    group = "applitools"
    description = "Run compareWithFigma for Android rows in the shared Figma Excel file"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "io/eot/pipeline/appium/android/CompareAndroidWithFigmaTest.class"
    configureTestNGTask(it)
}

task compareIosWithFigma(type: Test) {
    group = "applitools"
    description = "Run compareWithFigma for iOS rows in the shared Figma Excel file"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "io/eot/pipeline/appium/ios/CompareIosWithFigmaTest.class"
    configureTestNGTask(it)
}

task uploadFromFigma(type: JavaExec) {
    group = "applitools"
    description = "Upload Figma designs listed in the shared Figma Excel file to Applitools as baselines"
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    mainClass.set("io.eot.figmacompare.UploadFromFigma")
    doFirst {
        if (project.hasProperty("figmaExcel")) {
            systemProperty "figmaExcel", project.property("figmaExcel")
        }
        if (project.hasProperty("forceRefresh")) {
            systemProperty "forceRefresh", project.property("forceRefresh")
        }
        if (project.hasProperty("platform")) {
            systemProperty "platform", project.property("platform")
        }
    }
}

// Named cleanFigmaExcel, not "clean" - Gradle's own built-in `clean` lifecycle task
// (directory cleanup, configured below) already owns that name.
task cleanFigmaExcel(type: JavaExec) {
    group = "applitools"
    description = "Reset the shared Figma Excel file's write-back result columns (App Name, Baseline Batch " +
            "URL, Status, Error Message, Comparison Batch URL, Validation Status) - leaves every manual-input " +
            "column, including Baseline Env Name/Viewport/Test Name, untouched"
    classpath = sourceSets.test.runtimeClasspath
    workingDir = rootDir
    mainClass.set("io.eot.figmacompare.excel.CleanExcel")
    doFirst {
        if (project.hasProperty("figmaExcel")) {
            systemProperty "figmaExcel", project.property("figmaExcel")
        }
    }
}

clean.doFirst {
    delete "${rootDir}/target"
    delete "${rootDir}/bin"
    delete "${rootDir}/build"
    delete "${rootDir}/out"
    println "Clean: Deleted bin, build, out, target and reports directories"
}

clean.doLast {
    mkdir "${rootDir}/reports"
    println "Created reports directory"
}

wrapper {
    gradleVersion = project.gradleVersion // version from gradle.properties
}
